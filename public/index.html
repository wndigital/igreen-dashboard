<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iGreen - Painel de Operações</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Montserrat',sans-serif; background:#0F1114; color:#F8F9FA; }
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    @keyframes glow{0%,100%{box-shadow:0 0 8px rgba(39,174,96,.3)}50%{box-shadow:0 0 20px rgba(39,174,96,.6)}}
    input,select,button { font-family:'Montserrat',sans-serif; }
    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:#1A1D21; }
    ::-webkit-scrollbar-thumb { background:#2D3238; border-radius:3px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ═══ API Helper ═══
const api = {
  get: async (url) => { const r = await fetch(url); if(!r.ok) throw new Error(await r.text()); return r.json(); },
  post: async (url, data) => { const r = await fetch(url, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); if(!r.ok){ const e = await r.json(); throw new Error(e.error||'Erro'); } return r.json(); },
  put: async (url, data) => { const r = await fetch(url, {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); if(!r.ok) throw new Error(await r.text()); return r.json(); },
  del: async (url) => { const r = await fetch(url, {method:'DELETE'}); if(!r.ok) throw new Error(await r.text()); return r.json(); },
};

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const toISO = (d) => d.toISOString().slice(0, 10);
const fmtDate = (iso) => { if(!iso) return "—"; const [y,m,d] = iso.split("-"); return `${d}/${m}/${y}`; };
const fmtMoney = (v) => `R$ ${Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const todayISO = () => toISO(new Date());
const yesterdayISO = () => { const d=new Date(); d.setDate(d.getDate()-1); return toISO(d); };
const dayBeforeISO = () => { const d=new Date(); d.setDate(d.getDate()-2); return toISO(d); };
const last7ISO = () => { const d=new Date(); d.setDate(d.getDate()-6); return toISO(d); };
const monthStartISO = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`; };

const FONT = "'Montserrat', sans-serif";
const C = {
  green1:"#0B6B3A", green2:"#1B9E5A", green3:"#27AE60",
  greenGrad:"linear-gradient(135deg, #0B6B3A 0%, #1B9E5A 50%, #27AE60 100%)",
  dark:"#1A1D21", darkBorder:"#2D3238", text:"#F8F9FA", textMuted:"#9CA3AF",
  bg:"#0F1114", cardBg:"#1A1D23", red:"#EF4444", yellow:"#F59E0B", blue:"#3B82F6", orange:"#F97316",
};

const ic = {
  dashboard: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>,
  launch: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M5 12h14"/></svg>,
  commission: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>,
  users: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>,
  history: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
  access: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>,
  edit: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
  trash: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>,
  check: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
  x: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
  menu: <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>,
  trophy: <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 010-5H6"/><path d="M18 9h1.5a2.5 2.5 0 000-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0012 0V2z"/></svg>,
  eye: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,
  eyeOff: <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>,
  logout: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
};

const iS = {width:"100%",padding:"10px 14px",borderRadius:8,border:`1px solid ${C.darkBorder}`,background:C.dark,color:C.text,fontFamily:FONT,fontSize:14,outline:"none",boxSizing:"border-box"};
const lS = {fontSize:12,fontWeight:600,color:C.textMuted,marginBottom:6,display:"block",textTransform:"uppercase",letterSpacing:.5};
const bG = {padding:"10px 20px",borderRadius:8,border:"none",background:C.greenGrad,color:"#fff",fontFamily:FONT,fontSize:14,fontWeight:600,cursor:"pointer"};
const bO = {padding:"10px 20px",borderRadius:8,border:`1px solid ${C.darkBorder}`,background:"transparent",color:C.textMuted,fontFamily:FONT,fontSize:14,fontWeight:500,cursor:"pointer"};

function Card({children,style={},...p}){return <div style={{background:C.cardBg,borderRadius:14,border:`1px solid ${C.darkBorder}`,padding:20,...style}} {...p}>{children}</div>}
function StatCard({label,value,sub,color=C.green3}){return <Card style={{display:"flex",flexDirection:"column",gap:6,minWidth:0}}><span style={{fontSize:12,color:C.textMuted,fontWeight:500,textTransform:"uppercase",letterSpacing:.5}}>{label}</span><span style={{fontSize:24,fontWeight:800,color}}>{value}</span>{sub&&<span style={{fontSize:11,color:C.textMuted}}>{sub}</span>}</Card>}

function ConfirmModal({open,title,msg,onOk,onNo,okText="Confirmar",okColor=C.red}){
  if(!open)return null;
  return <div style={{position:"fixed",inset:0,zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center"}}><div onClick={onNo} style={{position:"absolute",inset:0,background:"rgba(0,0,0,.7)",backdropFilter:"blur(4px)"}}/><div style={{position:"relative",background:C.dark,border:`1px solid ${C.darkBorder}`,borderRadius:16,padding:"28px 32px",maxWidth:440,width:"90%",boxShadow:"0 20px 60px rgba(0,0,0,.5)"}}><h3 style={{margin:"0 0 12px",fontSize:16,fontWeight:700,color:C.text}}>{title}</h3><p style={{margin:"0 0 24px",fontSize:14,color:C.textMuted,lineHeight:1.5}}>{msg}</p><div style={{display:"flex",gap:10,justifyContent:"flex-end"}}><button onClick={onNo} style={{...bO,padding:"10px 24px"}}>Cancelar</button><button onClick={onOk} style={{padding:"10px 24px",borderRadius:8,border:"none",background:okColor,color:"#fff",fontFamily:FONT,fontSize:14,fontWeight:600,cursor:"pointer"}}>{okText}</button></div></div></div>
}

function FilterBar({filter,setFilter}){
  const [custom,setCustom]=useState({start:monthStartISO(),end:todayISO()});
  const opts=[{id:"today",label:"Hoje"},{id:"yesterday",label:"Ontem"},{id:"daybefore",label:"Anteontem"},{id:"last7",label:"Últimos 7 dias"},{id:"month",label:"Mês atual"},{id:"custom",label:"Personalizado"}];
  return <div style={{display:"flex",flexWrap:"wrap",gap:8,alignItems:"center",marginBottom:20}}>
    {opts.map(o=><button key={o.id} onClick={()=>setFilter(o.id==="custom"?{type:"custom",...custom}:{type:o.id})} style={{padding:"7px 16px",borderRadius:20,border:filter.type===o.id?`2px solid ${C.green3}`:`1px solid ${C.darkBorder}`,background:filter.type===o.id?"rgba(27,158,90,.15)":"transparent",color:filter.type===o.id?C.green3:C.textMuted,fontFamily:FONT,fontSize:13,fontWeight:filter.type===o.id?600:400,cursor:"pointer"}}>{o.label}</button>)}
    {filter.type==="custom"&&<div style={{display:"flex",gap:8,alignItems:"center"}}><input type="date" value={filter.start||custom.start} onChange={e=>{setCustom(p=>({...p,start:e.target.value}));setFilter(p=>({...p,start:e.target.value}))}} style={{...iS,width:150,padding:"6px 10px",fontSize:12}}/><span style={{color:C.textMuted,fontSize:12}}>até</span><input type="date" value={filter.end||custom.end} onChange={e=>{setCustom(p=>({...p,end:e.target.value}));setFilter(p=>({...p,end:e.target.value}))}} style={{...iS,width:150,padding:"6px 10px",fontSize:12}}/></div>}
  </div>
}

function getRange(f){switch(f.type){case"today":return{start:todayISO(),end:todayISO()};case"yesterday":return{start:yesterdayISO(),end:yesterdayISO()};case"daybefore":return{start:dayBeforeISO(),end:dayBeforeISO()};case"last7":return{start:last7ISO(),end:todayISO()};case"month":return{start:monthStartISO(),end:todayISO()};case"custom":return{start:f.start||monthStartISO(),end:f.end||todayISO()};default:return{start:monthStartISO(),end:todayISO()}}}
function filterEntries(entries,filter){const{start,end}=getRange(filter);return entries.filter(e=>e.date>=start&&e.date<=end)}
function rBadge(role){const ic2=role==="cadastro"||role==="Cadastro";return <span style={{padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:600,background:ic2?"rgba(249,115,22,.15)":"rgba(27,158,90,.15)",color:ic2?C.orange:C.green3}}>{ic2?"Cadastro":"Assinatura"}</span>}

// ═══ LOGIN ═══
function LoginScreen({onLogin}){
  const[email,setEmail]=useState("");const[pass,setPass]=useState("");const[show,setShow]=useState(false);const[err,setErr]=useState("");const[loading,setLoading]=useState(false);
  const go=async()=>{
    setLoading(true);setErr("");
    try{const u=await api.post('/api/login',{email,password:pass});onLogin(u)}
    catch(e){setErr(e.message||"Email ou senha incorretos.")}
    finally{setLoading(false)}
  };
  return <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:FONT,padding:20}}>
    <div style={{width:"100%",maxWidth:420}}>
      <div style={{textAlign:"center",marginBottom:40}}>
        <div style={{width:60,height:60,borderRadius:16,background:C.greenGrad,display:"inline-flex",alignItems:"center",justifyContent:"center",marginBottom:16}}><svg width="32" height="32" viewBox="0 0 24 24" fill="white"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
        <h1 style={{color:C.green3,fontSize:28,fontWeight:800,margin:"0 0 4px"}}>iGreen</h1>
        <p style={{color:C.textMuted,fontSize:13,margin:0}}>Painel de Operações</p>
      </div>
      <Card style={{padding:32}}>
        <h2 style={{margin:"0 0 24px",fontSize:18,fontWeight:700,color:C.text,textAlign:"center"}}>Entrar</h2>
        <div style={{marginBottom:16}}><label style={lS}>Email</label><input value={email} onChange={e=>setEmail(e.target.value)} placeholder="seu@email.com" style={iS} onKeyDown={e=>e.key==="Enter"&&go()}/></div>
        <div style={{marginBottom:8}}><label style={lS}>Senha</label><div style={{position:"relative"}}><input type={show?"text":"password"} value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••" style={iS} onKeyDown={e=>e.key==="Enter"&&go()}/><button onClick={()=>setShow(!show)} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:C.textMuted,cursor:"pointer"}}>{show?ic.eyeOff:ic.eye}</button></div></div>
        {err&&<p style={{color:C.red,fontSize:12,margin:"8px 0 0"}}>{err}</p>}
        <button onClick={go} disabled={loading} style={{...bG,width:"100%",marginTop:20,padding:"12px 20px",fontSize:15,opacity:loading?.6:1}}>{loading?"Entrando...":"Entrar"}</button>
      </Card>
    </div>
  </div>
}

// ═══ MAIN APP ═══
function App(){
  const[entries,setEntries]=useState([]);
  const[attendants,setAttendants]=useState([]);
  const[commPaid,setCommPaid]=useState([]);
  const[users,setUsers]=useState([]);
  const[loggedUser,setLoggedUser]=useState(null);
  const[tab,setTab]=useState("dashboard");
  const[sideOpen,setSideOpen]=useState(false);
  const[loading,setLoading]=useState(false);

  // Load all data from API
  const loadData = async () => {
    try {
      const [e,a,c] = await Promise.all([api.get('/api/entries'), api.get('/api/attendants'), api.get('/api/comm-paid')]);
      setEntries(e); setAttendants(a); setCommPaid(c);
    } catch(err) { console.error('Load error:', err); }
  };

  const loadUsers = async () => {
    try { const u = await api.get('/api/users'); setUsers(u); } catch(err) { console.error(err); }
  };

  useEffect(() => { if(loggedUser) { loadData(); loadUsers(); } }, [loggedUser]);

  // Refresh data periodically
  useEffect(() => {
    if(!loggedUser) return;
    const interval = setInterval(loadData, 10000);
    return () => clearInterval(interval);
  }, [loggedUser]);

  const activeAtts = useMemo(() => attendants.filter(a => a.active), [attendants]);

  if(!loggedUser) return <LoginScreen onLogin={u=>{setLoggedUser(u);setTab(u.cargo==="ADM"?"dashboard":"my_commission")}}/>;
  const isAdm = loggedUser.cargo==="ADM";
  const allTabs=[
    {id:"dashboard",label:"Dashboard",icon:ic.dashboard,adm:true},
    {id:"launch",label:"Lançamentos",icon:ic.launch,adm:true},
    {id:"commission",label:"Comissões",icon:ic.commission,adm:true},
    {id:"attendants",label:"Atendentes",icon:ic.users,adm:true},
    {id:"history",label:"Histórico",icon:ic.history,adm:true},
    {id:"access",label:"Acessos",icon:ic.access,adm:true},
    {id:"my_commission",label:"Minhas Comissões",icon:ic.commission,adm:false},
  ];
  const visTabs = isAdm ? allTabs.filter(t=>t.adm) : allTabs.filter(t=>!t.adm);

  return <div style={{fontFamily:FONT,background:C.bg,color:C.text,minHeight:"100vh",display:"flex",position:"relative"}}>
    {sideOpen&&<div onClick={()=>setSideOpen(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:40}}/>}
    <aside style={{width:260,background:C.dark,borderRight:`1px solid ${C.darkBorder}`,display:"flex",flexDirection:"column",position:"fixed",top:0,left:sideOpen?0:-260,height:"100vh",zIndex:50,transition:"left .3s ease",...(window.innerWidth>=768?{left:0}:{})}}>
      <div style={{padding:"24px 20px",borderBottom:`1px solid ${C.darkBorder}`}}><div style={{display:"flex",alignItems:"center",gap:10}}><div style={{width:36,height:36,borderRadius:10,background:C.greenGrad,display:"flex",alignItems:"center",justifyContent:"center"}}><svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div><div><span style={{fontWeight:800,fontSize:18,color:C.green3}}>iGreen</span><span style={{fontWeight:300,fontSize:11,display:"block",color:C.textMuted,marginTop:-2}}>Painel de Operações</span></div></div></div>
      <nav style={{padding:"12px 10px",flex:1}}>{visTabs.map(t=><button key={t.id} onClick={()=>{setTab(t.id);setSideOpen(false)}} style={{display:"flex",alignItems:"center",gap:12,width:"100%",padding:"12px 14px",border:"none",borderRadius:10,cursor:"pointer",marginBottom:4,transition:"all .2s",background:tab===t.id?"rgba(27,158,90,.15)":"transparent",color:tab===t.id?C.green3:C.textMuted,fontFamily:FONT,fontSize:14,fontWeight:tab===t.id?600:400,borderLeft:tab===t.id?`3px solid ${C.green3}`:"3px solid transparent"}}>{t.icon}<span>{t.label}</span></button>)}</nav>
      <div style={{padding:"12px 10px",borderTop:`1px solid ${C.darkBorder}`}}><button onClick={()=>{setLoggedUser(null);setTab("dashboard")}} style={{display:"flex",alignItems:"center",gap:12,width:"100%",padding:"12px 14px",border:"none",borderRadius:10,cursor:"pointer",background:"transparent",color:C.red,fontFamily:FONT,fontSize:14,fontWeight:500}}>{ic.logout}<span>Sair</span></button></div>
      <div style={{padding:"12px 20px",borderTop:`1px solid ${C.darkBorder}`,fontSize:11,color:C.textMuted}}>© 2026 iGreen Energy</div>
    </aside>
    <main style={{flex:1,marginLeft:window.innerWidth>=768?260:0,minHeight:"100vh"}}>
      <header style={{padding:"16px 24px",borderBottom:`1px solid ${C.darkBorder}`,display:"flex",alignItems:"center",justifyContent:"space-between",background:C.dark,position:"sticky",top:0,zIndex:30}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}><button onClick={()=>setSideOpen(!sideOpen)} style={{background:"none",border:"none",color:C.textMuted,cursor:"pointer",padding:4,display:window.innerWidth>=768?"none":"block"}}>{ic.menu}</button><h1 style={{fontSize:20,fontWeight:700,margin:0}}>{visTabs.find(t=>t.id===tab)?.label||""}</h1></div>
        <div style={{display:"flex",alignItems:"center",gap:10}}><div style={{width:34,height:34,borderRadius:"50%",background:C.greenGrad,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:14}}>{loggedUser.name.charAt(0).toUpperCase()}</div><span style={{fontSize:13,fontWeight:500}}>{loggedUser.name}</span><span style={{fontSize:10,background:"rgba(27,158,90,.2)",color:C.green3,padding:"2px 8px",borderRadius:20,fontWeight:600}}>{loggedUser.cargo}</span></div>
      </header>
      <div style={{padding:24,maxWidth:1400,margin:"0 auto"}}>
        {isAdm&&tab==="dashboard"&&<DashTab entries={entries} attendants={attendants}/>}
        {isAdm&&tab==="launch"&&<LaunchTab entries={entries} setEntries={setEntries} activeAtts={activeAtts} attendants={attendants} reload={loadData}/>}
        {isAdm&&tab==="commission"&&<CommTab entries={entries} attendants={attendants} commPaid={commPaid} setCommPaid={setCommPaid} reload={loadData}/>}
        {isAdm&&tab==="attendants"&&<AttTab attendants={attendants} setAttendants={setAttendants} reload={loadData}/>}
        {isAdm&&tab==="history"&&<HistTab entries={entries} setEntries={setEntries} attendants={attendants} reload={loadData}/>}
        {isAdm&&tab==="access"&&<AccessTab users={users} setUsers={setUsers} reload={loadUsers}/>}
        {!isAdm&&tab==="my_commission"&&<EmpCommTab user={loggedUser} entries={entries} attendants={attendants} commPaid={commPaid}/>}
      </div>
    </main>
  </div>
}

// ═══ DASHBOARD ═══
function DashTab({entries,attendants}){
  const[filter,setFilter]=useState({type:"today"});
  const filtered=useMemo(()=>filterEntries(entries,filter),[entries,filter]);
  const s=useMemo(()=>{
    const inv=filtered.reduce((s,e)=>s+Number(e.invested||0),0);const ld=filtered.reduce((s,e)=>s+Number(e.leads||0),0);
    const cad=filtered.reduce((s,e)=>s+(e.cadastros||[]).reduce((a,c)=>a+Number(c.qty||0),0),0);
    const ass=filtered.reduce((s,e)=>s+(e.assinaturas||[]).reduce((a,c)=>a+Number(c.qty||0),0),0);
    const cBA={};const aBA={};
    filtered.forEach(e=>{(e.cadastros||[]).forEach(c=>{cBA[c.attId]=(cBA[c.attId]||0)+Number(c.qty||0)});(e.assinaturas||[]).forEach(a=>{aBA[a.attId]=(aBA[a.attId]||0)+Number(a.qty||0)})});
    let tc=0;Object.values(cBA).forEach(q=>{if(q>20)tc+=(q-20)*5});Object.values(aBA).forEach(q=>{if(q>20)tc+=(q-20)*5});
    return{inv,ld,cad,ass,tc,cpl:ld?inv/ld:0,cpc:cad?inv/cad:0,cpa:ass?inv/ass:0,txLC:ld?(cad/ld*100):0,txCA:cad?(ass/cad*100):0,txLA:ld?(ass/ld*100):0,cBA,aBA}
  },[filtered]);
  const cR=useMemo(()=>Object.entries(s.cBA).map(([id,qty])=>({att:attendants.find(a=>a.id===id),qty})).filter(r=>r.att).sort((a,b)=>b.qty-a.qty),[s.cBA,attendants]);
  const aR=useMemo(()=>Object.entries(s.aBA).map(([id,qty])=>({att:attendants.find(a=>a.id===id),qty})).filter(r=>r.att).sort((a,b)=>b.qty-a.qty),[s.aBA,attendants]);

  return <div>
    <FilterBar filter={filter} setFilter={setFilter}/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(170px,1fr))",gap:14,marginBottom:20}}>
      <StatCard label="Total Investido" value={fmtMoney(s.inv)} color={C.green3}/><StatCard label="Leads WhatsApp" value={s.ld} color={C.blue}/><StatCard label="Custo/Lead" value={fmtMoney(s.cpl)} color={C.textMuted}/><StatCard label="Cadastros" value={s.cad} color={C.orange}/><StatCard label="Custo/Cadastro" value={fmtMoney(s.cpc)} color={C.textMuted}/><StatCard label="Assinaturas" value={s.ass} color={C.green3}/><StatCard label="Custo/Assinatura" value={fmtMoney(s.cpa)} color={C.textMuted}/><StatCard label="Total Comissão" value={fmtMoney(s.tc)} sub="no período" color={C.orange}/>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:14,marginBottom:20}}>
      {[{l:"Lead → Cadastro",v:s.txLC,c:C.orange,g:`linear-gradient(90deg,${C.orange},#FB923C)`},{l:"Cadastro → Assinatura",v:s.txCA,c:C.green3,g:C.greenGrad},{l:"Lead → Assinatura",v:s.txLA,c:C.blue,g:`linear-gradient(90deg,${C.blue},#8B5CF6)`}].map(x=><Card key={x.l}><span style={{fontSize:11,color:C.textMuted,textTransform:"uppercase",fontWeight:600}}>{x.l}</span><div style={{fontSize:32,fontWeight:800,color:x.c,marginTop:8}}>{x.v.toFixed(1)}%</div><div style={{height:6,borderRadius:3,background:C.darkBorder,marginTop:10}}><div style={{height:6,borderRadius:3,background:x.g,width:`${Math.min(x.v,100)}%`,transition:"width .5s"}}/></div></Card>)}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))",gap:14,marginBottom:20}}>
      {[{t:"Ranking Cadastros",d:cR,c:C.orange},{t:"Ranking Assinaturas",d:aR,c:C.green3}].map(rk=><Card key={rk.t}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}><div style={{color:C.yellow}}>{ic.trophy}</div><h3 style={{margin:0,fontSize:14,fontWeight:700}}>{rk.t}</h3></div>{rk.d.length===0&&<p style={{color:C.textMuted,fontSize:13}}>Sem dados</p>}{rk.d.map((r,i)=><div key={r.att.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 0",borderBottom:i<rk.d.length-1?`1px solid ${C.darkBorder}`:"none"}}><span style={{width:28,height:28,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",background:i===0?C.yellow:i===1?"#94A3B8":i===2?"#CD7F32":C.darkBorder,color:i<3?"#000":C.textMuted,fontWeight:800,fontSize:12}}>{i+1}</span><span style={{flex:1,fontWeight:500,fontSize:14}}>{r.att.name}</span><span style={{fontWeight:800,fontSize:16,color:rk.c}}>{r.qty}</span></div>)}</Card>)}
    </div>
    <Card><h3 style={{margin:"0 0 16px",fontSize:14,fontWeight:700}}>Resumo Financeiro</h3><div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:14}}>{[{l:"Investido em Ads",v:fmtMoney(s.inv),c:C.green3},{l:"Comissões no Período",v:fmtMoney(s.tc),c:C.orange},{l:"Custo Total Operação",v:fmtMoney(s.inv+s.tc),c:C.red},{l:"Custo Real/Assinatura",v:fmtMoney(s.ass?(s.inv+s.tc)/s.ass:0),c:C.blue}].map(x=><div key={x.l} style={{padding:14,background:C.dark,borderRadius:10}}><span style={{fontSize:11,color:C.textMuted,fontWeight:500}}>{x.l}</span><div style={{fontSize:20,fontWeight:800,color:x.c,marginTop:4}}>{x.v}</div></div>)}</div></Card>
  </div>
}

// ═══ LAUNCH ═══
function LaunchTab({entries,setEntries,activeAtts,attendants,reload}){
  const emp={date:todayISO(),invested:"",leads:"",cadastros:[],assinaturas:[]};
  const[form,setForm]=useState(emp);const[editId,setEditId]=useState(null);const[cadR,setCadR]=useState([{attId:"",qty:""}]);const[assR,setAssR]=useState([{attId:"",qty:""}]);const[delId,setDelId]=useState(null);const[saving,setSaving]=useState(false);
  const cA=activeAtts.filter(a=>a.role==="cadastro");const aA=activeAtts.filter(a=>a.role==="assinatura");
  const reset=()=>{setForm(emp);setCadR([{attId:"",qty:""}]);setAssR([{attId:"",qty:""}]);setEditId(null)};

  const doSave=async()=>{
    setSaving(true);
    const en={id:editId||uid(),date:form.date,invested:form.invested,leads:form.leads,cadastros:cadR.filter(r=>r.attId&&r.qty),assinaturas:assR.filter(r=>r.attId&&r.qty)};
    try{
      if(editId) await api.put(`/api/entries/${editId}`,en);
      else await api.post('/api/entries',en);
      await reload();reset();
    }catch(e){alert('Erro: '+e.message)}
    finally{setSaving(false)}
  };
  const doEdit=e=>{setEditId(e.id);setForm({date:e.date,invested:e.invested,leads:e.leads});setCadR(e.cadastros.length?[...e.cadastros]:[{attId:"",qty:""}]);setAssR(e.assinaturas.length?[...e.assinaturas]:[{attId:"",qty:""}]);window.scrollTo({top:0,behavior:"smooth"})};
  const doDel=async()=>{try{await api.del(`/api/entries/${delId}`);await reload();setDelId(null)}catch(e){alert('Erro: '+e.message)}};
  const aN=id=>attendants.find(a=>a.id===id)?.name||"—";

  return <div>
    <ConfirmModal open={!!delId} title="Excluir Lançamento" msg="Tem certeza que deseja excluir este lançamento?" onOk={doDel} onNo={()=>setDelId(null)} okText="Confirmar Exclusão"/>
    <Card style={{marginBottom:24}}>
      <h3 style={{margin:"0 0 20px",fontSize:16,fontWeight:700,color:editId?C.yellow:C.green3}}>{editId?"✏️ Editando Lançamento":"Novo Lançamento"}</h3>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:16,marginBottom:20}}>
        <div><label style={lS}>Data</label><input type="date" value={form.date} onChange={e=>setForm(p=>({...p,date:e.target.value}))} style={iS}/></div>
        <div><label style={lS}>Investimento Ads (R$)</label><input type="number" step="0.01" placeholder="0,00" value={form.invested} onChange={e=>setForm(p=>({...p,invested:e.target.value}))} style={iS}/></div>
        <div><label style={lS}>Leads WhatsApp</label><input type="number" placeholder="0" value={form.leads} onChange={e=>setForm(p=>({...p,leads:e.target.value}))} style={iS}/></div>
      </div>
      <div style={{marginBottom:16}}><label style={lS}>Cadastros Realizados</label>{cadR.map((r,i)=><div key={i} style={{display:"flex",gap:10,marginBottom:8,alignItems:"center"}}><select value={r.attId} onChange={e=>{const v=[...cadR];v[i]={...v[i],attId:e.target.value};setCadR(v)}} style={{...iS,flex:2}}><option value="">Selecionar...</option>{cA.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}</select><input type="number" placeholder="Qtd" value={r.qty} onChange={e=>{const v=[...cadR];v[i]={...v[i],qty:e.target.value};setCadR(v)}} style={{...iS,flex:1}}/>{cadR.length>1&&<button onClick={()=>setCadR(p=>p.filter((_,j)=>j!==i))} style={{...bO,padding:"8px",color:C.red,borderColor:C.red}}>{ic.x}</button>}</div>)}<button onClick={()=>setCadR(p=>[...p,{attId:"",qty:""}])} style={{...bO,fontSize:12,padding:"6px 12px"}}>+ Adicionar</button></div>
      <div style={{marginBottom:20}}><label style={lS}>Assinaturas Realizadas</label>{assR.map((r,i)=><div key={i} style={{display:"flex",gap:10,marginBottom:8,alignItems:"center"}}><select value={r.attId} onChange={e=>{const v=[...assR];v[i]={...v[i],attId:e.target.value};setAssR(v)}} style={{...iS,flex:2}}><option value="">Selecionar...</option>{aA.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}</select><input type="number" placeholder="Qtd" value={r.qty} onChange={e=>{const v=[...assR];v[i]={...v[i],qty:e.target.value};setAssR(v)}} style={{...iS,flex:1}}/>{assR.length>1&&<button onClick={()=>setAssR(p=>p.filter((_,j)=>j!==i))} style={{...bO,padding:"8px",color:C.red,borderColor:C.red}}>{ic.x}</button>}</div>)}<button onClick={()=>setAssR(p=>[...p,{attId:"",qty:""}])} style={{...bO,fontSize:12,padding:"6px 12px"}}>+ Adicionar</button></div>
      <div style={{display:"flex",gap:10}}><button onClick={doSave} disabled={saving} style={{...bG,opacity:saving?.6:1}}>{saving?"Salvando...":editId?"Salvar Alteração":"Salvar Lançamento"}</button>{editId&&<button onClick={reset} style={bO}>Cancelar</button>}</div>
    </Card>
    <Card><h3 style={{margin:"0 0 16px",fontSize:14,fontWeight:700}}>Lançamentos Recentes</h3>{entries.length===0&&<p style={{color:C.textMuted,fontSize:13}}>Nenhum lançamento ainda.</p>}<div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>{entries.length>0&&<thead><tr style={{borderBottom:`1px solid ${C.darkBorder}`}}>{["Data","Investido","Leads","Cadastros","Assinaturas","Ações"].map(h=><th key={h} style={{padding:"10px 12px",textAlign:"left",fontWeight:600,color:C.textMuted,fontSize:11,textTransform:"uppercase"}}>{h}</th>)}</tr></thead>}<tbody>{[...entries].sort((a,b)=>b.date.localeCompare(a.date)).map(e=><tr key={e.id} style={{borderBottom:`1px solid ${C.darkBorder}`}}><td style={{padding:12}}>{fmtDate(e.date)}</td><td style={{padding:12,color:C.green3,fontWeight:600}}>{fmtMoney(e.invested)}</td><td style={{padding:12}}>{e.leads}</td><td style={{padding:12}}>{(e.cadastros||[]).map(c=>`${aN(c.attId)}: ${c.qty}`).join(", ")||"—"}</td><td style={{padding:12}}>{(e.assinaturas||[]).map(a=>`${aN(a.attId)}: ${a.qty}`).join(", ")||"—"}</td><td style={{padding:12}}><div style={{display:"flex",gap:8}}><button onClick={()=>doEdit(e)} style={{background:"none",border:"none",color:C.yellow,cursor:"pointer",padding:4}}>{ic.edit}</button><button onClick={()=>setDelId(e.id)} style={{background:"none",border:"none",color:C.red,cursor:"pointer",padding:4}}>{ic.trash}</button></div></td></tr>)}</tbody></table></div></Card>
  </div>
}

// ═══ COMMISSIONS ═══
function CommTab({entries,attendants,commPaid,setCommPaid,reload}){
  const[fAtt,setFAtt]=useState("");const[fPer,setFPer]=useState({start:"",end:""});const[payM,setPayM]=useState(false);const[payR,setPayR]=useState({start:"",end:""});
  const paidDS=useMemo(()=>{const m={};commPaid.forEach(c=>{if(!m[c.attId])m[c.attId]=new Set();(c.paidDates||[]).forEach(d=>m[c.attId].add(d))});return m},[commPaid]);
  const pendR=useMemo(()=>{const cBA={};const aBA={};entries.forEach(e=>{(e.cadastros||[]).forEach(c=>{if(paidDS[c.attId]?.has(e.date))return;cBA[c.attId]=(cBA[c.attId]||0)+Number(c.qty||0)});(e.assinaturas||[]).forEach(a=>{if(paidDS[a.attId]?.has(e.date))return;aBA[a.attId]=(aBA[a.attId]||0)+Number(a.qty||0)})});const rows=[];attendants.forEach(att=>{const q=att.role==="cadastro"?(cBA[att.id]||0):(aBA[att.id]||0);const b=q>20?(q-20)*5:0;if(q>0)rows.push({att,qty:q,ab:Math.max(q-20,0),bonus:b})});return rows},[entries,attendants,paidDS]);
  const tPend=pendR.reduce((s,r)=>s+r.bonus,0);const tPaid=commPaid.reduce((s,c)=>s+Number(c.amount||0),0);const tPaidM=commPaid.filter(c=>c.paidDate>=monthStartISO()).reduce((s,c)=>s+Number(c.amount||0),0);const wC=commPaid.length?[...new Set(commPaid.map(c=>c.periodLabel))].length:0;

  const doPay=async()=>{
    if(!payR.start||!payR.end)return alert("Selecione o período.");
    const cBA={};const aBA={};const dates=[];
    entries.filter(e=>e.date>=payR.start&&e.date<=payR.end).forEach(e=>{dates.push(e.date);(e.cadastros||[]).forEach(c=>{if(paidDS[c.attId]?.has(e.date))return;cBA[c.attId]=(cBA[c.attId]||0)+Number(c.qty||0)});(e.assinaturas||[]).forEach(a=>{if(paidDS[a.attId]?.has(e.date))return;aBA[a.attId]=(aBA[a.attId]||0)+Number(a.qty||0)})});
    const recs=[];attendants.forEach(att=>{const q=att.role==="cadastro"?(cBA[att.id]||0):(aBA[att.id]||0);const b=q>20?(q-20)*5:0;if(b>0)recs.push({id:uid(),attId:att.id,attName:att.name,role:att.role,qty:q,above20:q-20,amount:b,periodLabel:`${fmtDate(payR.start)} - ${fmtDate(payR.end)}`,paidDate:todayISO(),paidDates:[...new Set(dates)]})});
    if(!recs.length)return alert("Nenhuma comissão a pagar neste período.");
    try{await api.post('/api/comm-paid',recs);await reload();setPayM(false);setPayR({start:"",end:""})}catch(e){alert('Erro: '+e.message)}
  };
  const fPaid=useMemo(()=>{let l=commPaid;if(fAtt)l=l.filter(c=>c.attId===fAtt);if(fPer.start)l=l.filter(c=>c.paidDate>=fPer.start);if(fPer.end)l=l.filter(c=>c.paidDate<=fPer.end);return l},[commPaid,fAtt,fPer]);

  return <div>
    {payM&&<div style={{position:"fixed",inset:0,zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center"}}><div onClick={()=>setPayM(false)} style={{position:"absolute",inset:0,background:"rgba(0,0,0,.7)",backdropFilter:"blur(4px)"}}/><div style={{position:"relative",background:C.dark,border:`1px solid ${C.darkBorder}`,borderRadius:16,padding:"28px 32px",maxWidth:460,width:"90%",boxShadow:"0 20px 60px rgba(0,0,0,.5)"}}><h3 style={{margin:"0 0 8px",fontSize:18,fontWeight:700}}>Concluir Pagamento</h3><p style={{margin:"0 0 20px",fontSize:13,color:C.textMuted}}>Selecione o período dos dias que deseja marcar como pagos:</p><div style={{display:"flex",gap:12,marginBottom:24}}><div style={{flex:1}}><label style={lS}>Data Início</label><input type="date" value={payR.start} onChange={e=>setPayR(p=>({...p,start:e.target.value}))} style={iS}/></div><div style={{flex:1}}><label style={lS}>Data Fim</label><input type="date" value={payR.end} onChange={e=>setPayR(p=>({...p,end:e.target.value}))} style={iS}/></div></div><div style={{display:"flex",gap:10,justifyContent:"flex-end"}}><button onClick={()=>setPayM(false)} style={bO}>Cancelar</button><button onClick={doPay} style={bG}>Confirmar Pagamento</button></div></div></div>}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:14,marginBottom:24}}><StatCard label="Comissão Pendente" value={fmtMoney(tPend)} color={C.yellow}/><StatCard label="Total Pago (Geral)" value={fmtMoney(tPaid)} color={C.green3}/><StatCard label="Pago no Mês Atual" value={fmtMoney(tPaidM)} color={C.blue}/><StatCard label="Média por Período" value={fmtMoney(wC?tPaid/wC:0)} color={C.textMuted}/></div>
    <Card style={{marginBottom:24}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:10}}><div><h3 style={{margin:0,fontSize:16,fontWeight:700}}>Comissão Pendente</h3><span style={{fontSize:12,color:C.textMuted}}>Todos os dias não pagos</span></div><button onClick={()=>setPayM(true)} style={{...bG,display:"flex",alignItems:"center",gap:8}}>{ic.check} Concluir Pagamento</button></div>{pendR.length===0&&<p style={{color:C.textMuted,fontSize:13}}>Nenhuma comissão pendente.</p>}<div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>{pendR.length>0&&<thead><tr style={{borderBottom:`1px solid ${C.darkBorder}`}}>{["Atendente","Função","Total","Acima de 20","Comissão"].map(h=><th key={h} style={{padding:"10px 12px",textAlign:"left",fontWeight:600,color:C.textMuted,fontSize:11,textTransform:"uppercase"}}>{h}</th>)}</tr></thead>}<tbody>{pendR.map(r=><tr key={r.att.id} style={{borderBottom:`1px solid ${C.darkBorder}`}}><td style={{padding:12,fontWeight:600}}>{r.att.name}</td><td style={{padding:12}}>{rBadge(r.att.role)}</td><td style={{padding:12}}>{r.qty}</td><td style={{padding:12,color:r.ab>0?C.green3:C.textMuted,fontWeight:600}}>{r.ab}</td><td style={{padding:12,fontWeight:800,color:r.bonus>0?C.yellow:C.textMuted}}>{fmtMoney(r.bonus)}</td></tr>)}{pendR.length>0&&<tr style={{background:"rgba(27,158,90,.05)"}}><td colSpan={4} style={{padding:12,fontWeight:700,textAlign:"right"}}>TOTAL PENDENTE</td><td style={{padding:12,fontWeight:900,fontSize:16,color:C.yellow}}>{fmtMoney(tPend)}</td></tr>}</tbody></table></div></Card>
    <Card><h3 style={{margin:"0 0 16px",fontSize:16,fontWeight:700}}>Histórico de Comissões Pagas</h3><div style={{display:"flex",gap:12,marginBottom:16,flexWrap:"wrap"}}><div><label style={lS}>Atendente</label><select value={fAtt} onChange={e=>setFAtt(e.target.value)} style={{...iS,width:200}}><option value="">Todas</option>{attendants.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}</select></div><div><label style={lS}>De</label><input type="date" value={fPer.start} onChange={e=>setFPer(p=>({...p,start:e.target.value}))} style={{...iS,width:160}}/></div><div><label style={lS}>Até</label><input type="date" value={fPer.end} onChange={e=>setFPer(p=>({...p,end:e.target.value}))} style={{...iS,width:160}}/></div></div>{fPaid.length===0&&<p style={{color:C.textMuted,fontSize:13}}>Nenhuma comissão paga.</p>}<div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>{fPaid.length>0&&<thead><tr style={{borderBottom:`1px solid ${C.darkBorder}`}}>{["Período","Pago em","Atendente","Função","Realizados","Bonificados","Valor","Status"].map(h=><th key={h} style={{padding:"10px 12px",textAlign:"left",fontWeight:600,color:C.textMuted,fontSize:11,textTransform:"uppercase"}}>{h}</th>)}</tr></thead>}<tbody>{fPaid.map(c=><tr key={c.id} style={{borderBottom:`1px solid ${C.darkBorder}`}}><td style={{padding:12,fontSize:12}}>{c.periodLabel}</td><td style={{padding:12}}>{fmtDate(c.paidDate)}</td><td style={{padding:12,fontWeight:600}}>{c.attName}</td><td style={{padding:12}}>{rBadge(c.role)}</td><td style={{padding:12}}>{c.qty}</td><td style={{padding:12,fontWeight:600,color:C.green3}}>{c.above20}</td><td style={{padding:12,fontWeight:700}}>{fmtMoney(c.amount)}</td><td style={{padding:12}}><span style={{padding:"4px 12px",borderRadius:20,fontSize:11,fontWeight:700,background:"rgba(27,158,90,.2)",color:C.green3}}>PAGO</span></td></tr>)}</tbody></table></div></Card>
  </div>
}

// ═══ ATTENDANTS ═══
function AttTab({attendants,setAttendants,reload}){
  const[name,setName]=useState("");const[role,setRole]=useState("cadastro");const[saving,setSaving]=useState(false);
  const add=async()=>{if(!name.trim())return;setSaving(true);try{await api.post('/api/attendants',{id:uid(),name:name.trim(),role,createdAt:todayISO()});await reload();setName("")}catch(e){alert('Erro: '+e.message)}finally{setSaving(false)}};
  const tog=async(id)=>{try{await fetch(`/api/attendants/${id}/toggle`,{method:'PATCH'});await reload()}catch(e){alert('Erro: '+e.message)}};
  const ac=attendants.filter(a=>a.active);const ia=attendants.filter(a=>!a.active);
  return <div>
    <Card style={{marginBottom:24}}><h3 style={{margin:"0 0 20px",fontSize:16,fontWeight:700}}>Nova Atendente</h3><div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-end"}}><div style={{flex:2,minWidth:200}}><label style={lS}>Nome</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="Nome da atendente" style={iS} onKeyDown={e=>e.key==="Enter"&&add()}/></div><div style={{flex:1,minWidth:150}}><label style={lS}>Função</label><select value={role} onChange={e=>setRole(e.target.value)} style={iS}><option value="cadastro">Cadastro</option><option value="assinatura">Assinatura</option></select></div><button onClick={add} disabled={saving} style={{...bG,height:42,opacity:saving?.6:1}}>{saving?"...":"Cadastrar"}</button></div></Card>
    <Card style={{marginBottom:24}}><h3 style={{margin:"0 0 16px",fontSize:14,fontWeight:700,color:C.green3}}>Ativas ({ac.length})</h3>{ac.length===0&&<p style={{color:C.textMuted,fontSize:13}}>Nenhuma atendente.</p>}{ac.map(a=><div key={a.id} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 0",borderBottom:`1px solid ${C.darkBorder}`}}><div style={{width:36,height:36,borderRadius:"50%",background:C.greenGrad,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:14,color:"#fff"}}>{a.name.charAt(0).toUpperCase()}</div><div style={{flex:1}}><div style={{fontWeight:600,fontSize:14}}>{a.name}</div><div style={{fontSize:11,color:C.textMuted}}>Desde {fmtDate(a.createdAt||a.created_at)}</div></div>{rBadge(a.role)}<button onClick={()=>tog(a.id)} style={{...bO,padding:"6px 14px",fontSize:12,color:C.red,borderColor:C.red}}>Desativar</button></div>)}</Card>
    {ia.length>0&&<Card><h3 style={{margin:"0 0 16px",fontSize:14,fontWeight:700,color:C.textMuted}}>Inativas ({ia.length})</h3>{ia.map(a=><div key={a.id} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 0",borderBottom:`1px solid ${C.darkBorder}`,opacity:.6}}><div style={{width:36,height:36,borderRadius:"50%",background:C.darkBorder,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:14}}>{a.name.charAt(0).toUpperCase()}</div><div style={{flex:1}}><div style={{fontWeight:600,fontSize:14}}>{a.name}</div></div><button onClick={()=>tog(a.id)} style={{...bO,padding:"6px 14px",fontSize:12,color:C.green3,borderColor:C.green3}}>Reativar</button></div>)}</Card>}
  </div>
}

// ═══ HISTORY ═══
function HistTab({entries,setEntries,attendants,reload}){
  const[filter,setFilter]=useState({type:"today"});const filtered=useMemo(()=>filterEntries(entries,filter),[entries,filter]);
  const[eId,setEId]=useState(null);const[eF,setEF]=useState(null);const[delId,setDelId]=useState(null);
  const aN=id=>attendants.find(a=>a.id===id)?.name||"—";
  const sorted=[...filtered].sort((a,b)=>b.date.localeCompare(a.date));
  const doSaveEdit=async()=>{try{await api.put(`/api/entries/${eId}`,{...eF,cadastros:entries.find(e=>e.id===eId)?.cadastros||[],assinaturas:entries.find(e=>e.id===eId)?.assinaturas||[]});await reload();setEId(null);setEF(null)}catch(e){alert('Erro: '+e.message)}};
  const doDel=async()=>{try{await api.del(`/api/entries/${delId}`);await reload();setDelId(null)}catch(e){alert('Erro: '+e.message)}};

  return <div>
    <ConfirmModal open={!!delId} title="Excluir Registro" msg="Tem certeza que deseja excluir?" onOk={doDel} onNo={()=>setDelId(null)} okText="Confirmar Exclusão"/>
    <FilterBar filter={filter} setFilter={setFilter}/>
    <Card><h3 style={{margin:"0 0 16px",fontSize:14,fontWeight:700}}>Todos os Registros</h3>{sorted.length===0&&<p style={{color:C.textMuted,fontSize:13}}>Nenhum registro no período.</p>}<div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>{sorted.length>0&&<thead><tr style={{borderBottom:`1px solid ${C.darkBorder}`}}>{["Data","Investido","Leads","Cadastros","Assinaturas","CPL","CPC","CPA","Tx L→C","Tx C→A","Ações"].map(h=><th key={h} style={{padding:"10px 8px",textAlign:"left",fontWeight:600,color:C.textMuted,fontSize:10,textTransform:"uppercase",whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>}<tbody>{sorted.map(e=>{const cd=(e.cadastros||[]).reduce((s,c)=>s+Number(c.qty||0),0);const as2=(e.assinaturas||[]).reduce((s,c)=>s+Number(c.qty||0),0);const iv=Number(e.invested||0);const l=Number(e.leads||0);const isE=eId===e.id;return <tr key={e.id} style={{borderBottom:`1px solid ${C.darkBorder}`,background:isE?"rgba(245,158,11,.05)":"transparent"}}><td style={{padding:"10px 8px"}}>{isE?<input type="date" value={eF.date} onChange={ev=>setEF(p=>({...p,date:ev.target.value}))} style={{...iS,padding:"4px 8px",width:130,fontSize:12}}/>:fmtDate(e.date)}</td><td style={{padding:"10px 8px",color:C.green3,fontWeight:600}}>{isE?<input type="number" value={eF.invested} onChange={ev=>setEF(p=>({...p,invested:ev.target.value}))} style={{...iS,padding:"4px 8px",width:90,fontSize:12}}/>:fmtMoney(iv)}</td><td style={{padding:"10px 8px"}}>{isE?<input type="number" value={eF.leads} onChange={ev=>setEF(p=>({...p,leads:ev.target.value}))} style={{...iS,padding:"4px 8px",width:60,fontSize:12}}/>:l}</td><td style={{padding:"10px 8px"}}>{(e.cadastros||[]).map(c=>`${aN(c.attId)}: ${c.qty}`).join(", ")||"—"}</td><td style={{padding:"10px 8px"}}>{(e.assinaturas||[]).map(a=>`${aN(a.attId)}: ${a.qty}`).join(", ")||"—"}</td><td style={{padding:"10px 8px",fontSize:11,color:C.textMuted}}>{fmtMoney(l?iv/l:0)}</td><td style={{padding:"10px 8px",fontSize:11,color:C.textMuted}}>{fmtMoney(cd?iv/cd:0)}</td><td style={{padding:"10px 8px",fontSize:11,color:C.textMuted}}>{fmtMoney(as2?iv/as2:0)}</td><td style={{padding:"10px 8px",fontSize:11,color:C.orange}}>{l?(cd/l*100).toFixed(1):0}%</td><td style={{padding:"10px 8px",fontSize:11,color:C.green3}}>{cd?(as2/cd*100).toFixed(1):0}%</td><td style={{padding:"10px 8px"}}><div style={{display:"flex",gap:6}}>{isE?<React.Fragment><button onClick={doSaveEdit} style={{background:"none",border:"none",color:C.green3,cursor:"pointer",padding:4}}>{ic.check}</button><button onClick={()=>{setEId(null);setEF(null)}} style={{background:"none",border:"none",color:C.textMuted,cursor:"pointer",padding:4}}>{ic.x}</button></React.Fragment>:<React.Fragment><button onClick={()=>{setEId(e.id);setEF({date:e.date,invested:e.invested,leads:e.leads})}} style={{background:"none",border:"none",color:C.yellow,cursor:"pointer",padding:4}}>{ic.edit}</button><button onClick={()=>setDelId(e.id)} style={{background:"none",border:"none",color:C.red,cursor:"pointer",padding:4}}>{ic.trash}</button></React.Fragment>}</div></td></tr>})}</tbody></table></div></Card>
  </div>
}

// ═══ ACCESS ═══
function AccessTab({users,setUsers,reload}){
  const[form,setForm]=useState({name:"",email:"",password:"",cargo:"Cadastro"});const[showP,setShowP]=useState({});const[delId,setDelId]=useState(null);const[saving,setSaving]=useState(false);
  const add=async()=>{if(!form.name.trim()||!form.email.trim()||!form.password.trim())return;setSaving(true);try{await api.post('/api/users',{id:uid(),...form});await reload();setForm({name:"",email:"",password:"",cargo:"Cadastro"})}catch(e){alert('Erro: '+e.message)}finally{setSaving(false)}};
  const doDel=async()=>{try{await api.del(`/api/users/${delId}`);await reload();setDelId(null)}catch(e){alert('Erro: '+e.message)}};

  return <div>
    <ConfirmModal open={!!delId} title="Excluir Acesso" msg="Tem certeza que deseja excluir este acesso?" onOk={doDel} onNo={()=>setDelId(null)} okText="Confirmar Exclusão"/>
    <Card style={{marginBottom:24}}>
      <h3 style={{margin:"0 0 20px",fontSize:16,fontWeight:700}}>Novo Acesso</h3>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:16}}>
        <div><label style={lS}>Nome</label><input value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))} placeholder="Nome completo" style={iS}/></div>
        <div><label style={lS}>Email</label><input value={form.email} onChange={e=>setForm(p=>({...p,email:e.target.value}))} placeholder="email@exemplo.com" style={iS}/></div>
        <div><label style={lS}>Senha</label><input value={form.password} onChange={e=>setForm(p=>({...p,password:e.target.value}))} placeholder="Senha" style={iS}/></div>
        <div><label style={lS}>Cargo</label><select value={form.cargo} onChange={e=>setForm(p=>({...p,cargo:e.target.value}))} style={iS}><option>Cadastro</option><option>Assinatura</option><option>ADM</option></select></div>
      </div>
      <button onClick={add} disabled={saving} style={{...bG,marginTop:20,opacity:saving?.6:1}}>{saving?"Criando...":"Criar Acesso"}</button>
    </Card>
    <Card><h3 style={{margin:"0 0 16px",fontSize:14,fontWeight:700}}>Todos os Acessos ({users.length})</h3><div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}><thead><tr style={{borderBottom:`1px solid ${C.darkBorder}`}}>{["Nome","Email","Cargo","Ações"].map(h=><th key={h} style={{padding:"10px 12px",textAlign:"left",fontWeight:600,color:C.textMuted,fontSize:11,textTransform:"uppercase"}}>{h}</th>)}</tr></thead><tbody>{users.map(u=><tr key={u.id} style={{borderBottom:`1px solid ${C.darkBorder}`}}><td style={{padding:12}}><div style={{display:"flex",alignItems:"center",gap:10}}><div style={{width:32,height:32,borderRadius:"50%",background:u.cargo==="ADM"?C.greenGrad:u.cargo==="Cadastro"?`linear-gradient(135deg,${C.orange},#FB923C)`:`linear-gradient(135deg,${C.green1},${C.green3})`,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:13,color:"#fff"}}>{u.name.charAt(0).toUpperCase()}</div><span style={{fontWeight:600}}>{u.name}</span></div></td><td style={{padding:12,color:C.textMuted}}>{u.email}</td><td style={{padding:12}}><span style={{padding:"4px 12px",borderRadius:20,fontSize:11,fontWeight:700,background:u.cargo==="ADM"?"rgba(59,130,246,.15)":u.cargo==="Cadastro"?"rgba(249,115,22,.15)":"rgba(27,158,90,.15)",color:u.cargo==="ADM"?C.blue:u.cargo==="Cadastro"?C.orange:C.green3}}>{u.cargo}</span></td><td style={{padding:12}}>{u.id!=="adm0"&&<button onClick={()=>setDelId(u.id)} style={{background:"none",border:"none",color:C.red,cursor:"pointer",padding:4}}>{ic.trash}</button>}</td></tr>)}</tbody></table></div></Card>
  </div>
}

// ═══ EMPLOYEE COMMISSION (Gamified) ═══
function EmpCommTab({user,entries,attendants,commPaid}){
  const isCad=user.cargo==="Cadastro";const rl=isCad?"cadastros":"assinaturas";const rk=isCad?"cadastros":"assinaturas";
  const myAtt=attendants.find(a=>a.name.toLowerCase()===user.name.toLowerCase());
  const myData=useMemo(()=>{if(!myAtt)return[];return entries.map(e=>{const items=(e[rk]||[]).filter(c=>c.attId===myAtt.id);const q=items.reduce((s,c)=>s+Number(c.qty||0),0);if(!q)return null;return{date:e.date,qty:q}}).filter(Boolean).sort((a,b)=>b.date.localeCompare(a.date))},[entries,myAtt,rk]);
  const paidD=useMemo(()=>{if(!myAtt)return new Set();const s=new Set();commPaid.filter(c=>c.attId===myAtt.id).forEach(c=>(c.paidDates||[]).forEach(d=>s.add(d)));return s},[commPaid,myAtt]);
  const tQ=myData.reduce((s,d)=>s+d.qty,0);const tAb=Math.max(tQ-20,0);const tCA=tAb*5;
  const tCP=commPaid.filter(c=>c.attId===myAtt?.id).reduce((s,c)=>s+Number(c.amount||0),0);const tCPend=Math.max(tCA-tCP,0);

  if(!myAtt) return <div style={{textAlign:"center",padding:"60px 20px"}}><div style={{fontSize:48,marginBottom:16}}>😕</div><h2 style={{fontSize:20,fontWeight:700,marginBottom:8}}>Acesso não vinculado</h2><p style={{color:C.textMuted,fontSize:14}}>Seu nome não corresponde a nenhuma atendente. Peça ao administrador para verificar.</p></div>;

  const dl=i=>({animation:`fadeUp .5s ease ${i*0.1}s both`});
  return <div>
    <div style={{background:"linear-gradient(135deg, rgba(11,107,58,.3) 0%, rgba(27,174,96,.1) 100%)",borderRadius:20,padding:"32px 28px",marginBottom:24,border:"1px solid rgba(39,174,96,.2)",animation:"fadeUp .5s ease both"}}>
      <div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
        <div style={{width:56,height:56,borderRadius:"50%",background:C.greenGrad,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:22,color:"#fff",animation:"glow 2s ease infinite"}}>{user.name.charAt(0).toUpperCase()}</div>
        <div><h2 style={{margin:0,fontSize:22,fontWeight:800}}>Olá, {user.name.split(" ")[0]}! 👋</h2><p style={{margin:"4px 0 0",fontSize:13,color:C.textMuted}}>Confira suas comissões e resultados</p></div>
      </div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(170px,1fr))",gap:14,marginBottom:24}}>
      {[
        {l:"Comissão Total",v:fmtMoney(tCA),sub:"pendente + pago",c:C.blue,ici:"⭐",bg:"rgba(59,130,246,.08)",bc:"rgba(59,130,246,.2)"},
        {l:"Pendente",v:fmtMoney(tCPend),sub:"aguardando pagamento",c:C.yellow,ici:"⏳",bg:"rgba(245,158,11,.08)",bc:"rgba(245,158,11,.2)"},
        {l:"Comissão Paga",v:fmtMoney(tCP),sub:"já recebido",c:C.green3,ici:"✅",bg:"rgba(39,174,96,.08)",bc:"rgba(39,174,96,.2)"},
        {l:`Total de ${rl}`,v:tQ,sub:"realizados",c:C.orange,ici:"📊",bg:"rgba(249,115,22,.08)",bc:"rgba(249,115,22,.2)"},
        {l:"Acima da Meta",v:tAb,sub:"bonificados R$5 cada",c:"#8B5CF6",ici:"🏆",bg:"rgba(139,92,246,.08)",bc:"rgba(139,92,246,.2)"},
      ].map((x,i)=><div key={x.l} style={dl(i)}><Card style={{background:`linear-gradient(135deg, ${C.cardBg} 0%, ${x.bg} 100%)`,border:`1px solid ${x.bc}`}}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><span style={{fontSize:18}}>{x.ici}</span><span style={{fontSize:11,color:C.textMuted,fontWeight:600,textTransform:"uppercase"}}>{x.l}</span></div><span style={{fontSize:28,fontWeight:900,color:x.c}}>{x.v}</span><span style={{fontSize:11,color:C.textMuted,display:"block",marginTop:4}}>{x.sub}</span></Card></div>)}
    </div>
    <Card style={{marginBottom:24,animation:"fadeUp .5s ease .5s both"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}><h3 style={{margin:0,fontSize:14,fontWeight:700}}>Progresso para a Meta</h3><span style={{fontSize:24,fontWeight:900,color:tQ>=20?C.green3:C.orange}}>{tQ}/20</span></div>
      <div style={{height:12,borderRadius:6,background:C.darkBorder,overflow:"hidden"}}><div style={{height:12,borderRadius:6,background:tQ>=20?C.greenGrad:`linear-gradient(90deg,${C.orange},#FB923C)`,width:`${Math.min((tQ/20)*100,100)}%`,transition:"width 1s ease",boxShadow:tQ>=20?"0 0 12px rgba(39,174,96,.5)":"0 0 12px rgba(249,115,22,.5)"}}/></div>
      <p style={{margin:"10px 0 0",fontSize:12,color:C.textMuted}}>{tQ>=20?`🎉 Meta batida! Você tem ${tAb} ${rl} bonificados!`:`Faltam ${20-tQ} ${rl} para começar a ganhar comissão!`}</p>
    </Card>
    <Card style={{animation:"fadeUp .5s ease .6s both"}}>
      <h3 style={{margin:"0 0 16px",fontSize:14,fontWeight:700}}>Detalhamento por Dia</h3>
      {myData.length===0&&<p style={{color:C.textMuted,fontSize:13}}>Nenhum registro.</p>}
      <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>{myData.length>0&&<thead><tr style={{borderBottom:`1px solid ${C.darkBorder}`}}>{["Data","Usuário","Total","Acima da Meta","Comissão","Pagamento"].map(h=><th key={h} style={{padding:"10px 12px",textAlign:"left",fontWeight:600,color:C.textMuted,fontSize:11,textTransform:"uppercase"}}>{h}</th>)}</tr></thead>}<tbody>{myData.map((d,i)=>{const isPd=paidD.has(d.date);const ab=Math.max(d.qty-20,0);const cm=ab*5;return <tr key={d.date+i} style={{borderBottom:`1px solid ${C.darkBorder}`}}><td style={{padding:12,fontWeight:500}}>{fmtDate(d.date)}</td><td style={{padding:12}}>{user.name}</td><td style={{padding:12,fontWeight:700,color:C.orange}}>{d.qty}</td><td style={{padding:12,fontWeight:600,color:ab>0?"#8B5CF6":C.textMuted}}>{ab}</td><td style={{padding:12,fontWeight:700,color:cm>0?C.green3:C.textMuted}}>{fmtMoney(cm)}</td><td style={{padding:12}}><span style={{padding:"4px 14px",borderRadius:20,fontSize:11,fontWeight:700,background:isPd?"rgba(27,158,90,.15)":"rgba(249,115,22,.15)",color:isPd?C.green3:C.orange}}>{isPd?"PAGO":"PENDENTE"}</span></td></tr>})}</tbody></table></div>
    </Card>
  </div>
}

ReactDOM.render(<App/>, document.getElementById('root'));
  </script>
